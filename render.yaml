databases:
  - name: office-attendance-db
    databaseName: office_attendance
    user: postgres
    plan: free
    region: oregon

services:
  - type: web
    name: office-attendance-backend
    runtime: docker
    plan: free
    region: oregon
    rootDir: .
    dockerfilePath: Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: office-attendance-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: office-attendance-db
          property: port
      - key: DB_NAME
        value: office_attendance
      - key: DB_USERNAME
        fromDatabase:
          name: office-attendance-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: office-attendance-db
          property: password

  - type: web
    name: office-attendance-frontend
    runtime: docker
    plan: free
    region: oregon
    rootDir: frontend
    dockerfilePath: Dockerfile
    envVars:
      - key: VITE_API_BASE_URL
        value: https://office-attendance-backend.onrender.com/api
