spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 10000
      validation-timeout: 5000
      max-lifetime: 600000
      keepalive-time: 120000
  flyway:
    enabled: true

logging:
  level:
    root: info
